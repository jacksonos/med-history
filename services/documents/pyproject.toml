[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "my-med-history-documents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.32",
  "pydantic==2.14.1", "pypdf==6.21.2", "pypdfium2==5.14.0", "Pillow==13.0.0",
]

[project.optional-dependencies]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.3.1"]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
